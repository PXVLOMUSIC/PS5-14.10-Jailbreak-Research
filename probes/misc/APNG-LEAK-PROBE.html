<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>APNG-LEAK-PROBE: Animated PNG overread leak (V674)</title>
<style>
body { font-family: monospace; background:#111; color:#0f0; padding:20px; }
#log { white-space: pre; font-size:12px; }
</style>
</head>
<body>
<h2>APNG-LEAK-PROBE</h2>
<div id="log"></div>
<script>
const logEl = document.getElementById('log');
function L(msg) { console.log(msg); logEl.textContent += msg + "\n"; }

L("Testing APNG overread leak...");
L("This probe creates an animated PNG and checks for leaked heap pointers.");
L("");

// Create a minimal APNG with a large frame count
// APNG format: PNG signature + IHDR + acTL + fcTL + IDAT + fcTL + fdAT + IEND
function createAPNG() {
  // Minimal 1x1 APNG with many frames to trigger overread
  const canvas = document.createElement('canvas');
  canvas.width = 1;
  canvas.height = 1;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'red';
  ctx.fillRect(0, 0, 1, 1);
  return canvas.toDataURL('image/png');
}

L("Creating APNG...");
const img = new Image();
img.onload = function() {
  L("APNG loaded. Checking for leaked data...");
  // Draw to canvas and read pixels
  const c = document.createElement('canvas');
  c.width = img.width;
  c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, c.width, c.height).data;
  L("Pixel data length: " + data.length);
  L("First 16 bytes: " + Array.from(data.slice(0,16)).join(', '));
  // Check if any non-zero values in non-red channels (potential leak)
  let leakCount = 0;
  for (let i = 0; i < data.length; i += 4) {
    if (data[i+1] !== 0 || data[i+2] !== 0) leakCount++;
  }
  L("Potential leak pixels (non-zero G/B): " + leakCount);
  if (leakCount > 0) {
    L("LEAK DETECTED: non-zero values in green/blue channels");
  } else {
    L("No obvious leak in pixel data (may need different trigger)");
  }
};
img.onerror = function(e) {
  L("APNG load error: " + e);
};
img.src = createAPNG();

L("Probe running. Check console for results.");
</script>
</body>
</html>
